<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UrEducator 2.0 — Deploying</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --ink: #1b2130;
      --muted: #566078;
      --brand: #295c89;
      --accent: #3a8bed;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0f17;
        --card: #141b27;
        --ink: #f0f4fc;
        --muted: #9aa5bf;
        --brand: #3b7bb5;
        --accent: #5ba2f4;
      }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .card {
      background: var(--card);
      border: 1px solid rgba(125, 140, 170, 0.25);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--brand);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-size: 1.25rem;
      margin: 0.75rem 0 0.5rem;
      color: var(--ink);
    }
    p {
      color: var(--muted);
      font-size: 0.9375rem;
      line-height: 1.5;
      margin: 0.5rem 0 1.5rem;
    }
    .badge {
      display: inline-block;
      padding: 0.35rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-radius: 9999px;
      background: rgba(58, 139, 237, 0.12);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">UrEducator 2.0</div>
    <span class="badge">Deployment in Progress</span>
    <h1>UrEducator 2.0 is deploying...</h1>
    <p>We are rolling out our latest updates and full-length UGC NET Paper 1 mock test engine. Please check back in a few minutes.</p>
  </div>
</body>
</html>
